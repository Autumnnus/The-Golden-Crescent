version: 1
policy: 'Western Europe: the six French states, the German imperial princes without a Prussian union, Bohemia, Austria,
  the Low Countries, Switzerland and the Kalmar crowns. The inherited European populations already fit the written
  design and keep their scale and joint culture/faith groups. Literacy follows the delayed-Europe canon: Kalmar
  crowns and Protestant north German and city states highest, Catholic south and France middling, Brittany and Occitania
  lowest. Narrow mix corrections: Catholic majority restored in Alsace, larger Huguenot minorities in Poitou and
  Languedoc without a Revocation, and small Maghrebi, Andalusi, Rum and Levantine merchant communities in Marseille,
  Bordeaux, Paris, Amsterdam and Hamburg reflecting the Islamic world''s trade weight. Weights are per mille.'
