version: 1
policy: >-
  The independent Bengal Sultanate uses H7 law: inherited slaves become free
  people of the same culture and religion. British and Scottish civil/military
  officials in independent Indian polities are replaced by local officials of
  identical profession and headcount. Foreign capitalists can remain private
  merchants. All country and state totals, borders and other POPs stay intact.
