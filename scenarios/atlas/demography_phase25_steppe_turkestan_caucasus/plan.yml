version: 1
policy: >-
  Kazakh steppe, Turkestan, the Caucasus and Afghanistan-Baluchistan. The inherited Central Asian
  and Afghan populations are already local and are kept at inherited scale. Russian and Ukrainian
  settlement from the imperial conquest of the steppe (Orenburg, Chelyabinsk, the Yaik line,
  Semireche) and of the Caucasus (Kizlyar, Grozny, Vladikavkaz, Tiflis, Baku garrisons) is
  replaced at the user's moderate level by Kazakh, Bashkir, Tatar, Nogai and Caucasian peoples,
  keeping small Cossack/merchant remnants. Khanates and emirates with the vanilla debt-slavery law
  (H8 debt/household bondage) and the Turkmen slave-trade law keep their slave POPs; Russian captives
  in Khiva and Kokand are re-identified because a Russian empire never reached the region.
  Kafiristan's inherited Hindu official faith becomes the local faith. Weights are per mille.
