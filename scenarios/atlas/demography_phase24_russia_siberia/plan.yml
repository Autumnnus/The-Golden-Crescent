version: 1
policy: >-
  The Russian forest, Volga, Baltic, Finland and Siberia without a Russian empire. Moscow and
  Novgorod keep their Russian Orthodox cores; Ingria has no St Petersburg. The Great Tatar
  Khanate, the Mari, Mordvin and Ural councils, Crimea and the Siberian and far-eastern
  polities replace the inherited Russian/Ukrainian/German colonisation with their own peoples at
  the user's chosen moderate level (about 9 million), keeping small Russian merchant, captive,
  old Vyatka and Don Cossack communities. Traditional Chuvash, Mari, Udmurt, Mordvin, Siberian and
  Yakut faiths are restored where Orthodoxy came from imperial missions. Baltic and Finnish shares
  keep their Lutheran majorities with fewer Russians. Weights are per mille of each share.
