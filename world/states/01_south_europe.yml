# --- Iberya: "Ispanya" diye bir devlet yok ---------------------------------
# senaryo.md 24: Las Navas 1212'de kazanildi, Kastilya ve Aragon'un guneye
# ilerleyisi durdu. Ispanya hic kurulmadi; kuzeyde birbirinden ayri Hristiyan
# kralliklar, guneyde Endulus var. Portekiz de olusmadi - kuzeyi Galicya'ya,
# guneyi Endulus'e ait.
