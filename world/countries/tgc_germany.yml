# Kutsal Roma Imparatorlugu - "Avrupa'nin hasta adami" (senaryo.md 413)
#
# ============================================================================
# GEC REFORM
# ============================================================================
# Bu evrende Musluman yukselisi Katolik Kilise'yi bolmedi, kenetledi: reform
# baskisi schism'e degil hacli seferberligine kanalize oldu ve Protestanlik
# yuzyillar SONRA cikti. 1836'da Protestanlik 300 yillik yerlesik bir kilise
# degil, GENC VE RADIKAL BIR HAREKET - gercek 1836'da sosyalizmin oynadigi
# rolu bu evrende o oyniyor.
#
# Zinciri: gec Reform demek Augsburg (1555) yok, Otuz Yil Savaslari yok,
# Vestfalya (1648) yok demek. Imparatorluk "her prens kendi dinini secer"
# uzlasmasini hic yapmadi. senaryo.md 409'un "Katolik ve Protestan devletler
# arasinda bolunmustur" cumlesi cozulmus bir tarih degil, SU AN yasanan kriz.
#
# Bu yuzden Protestan devletlerde bile nufusun ucte biri Katolik: donusum
# tamamlanamadi.
#
# ============================================================================
# IMPARATORLUK NEDEN TABIIYET AGACI DEGIL
# ============================================================================
# Bavyera imparatorluk unvanini tutuyor (senaryo.md 406) ama kucuk devletleri
# tabii YAPMIYOR. Yapsaydi hareket edebilir hale gelirdi ve "hasta adam"
# tanimi bozulurdu; ustelik prenslerin ordularini da almis olurdu. Gercek
# Kutsal Roma'da da imparatorluk unvani prensler uzerinde neredeyse hic yetki
# vermiyordu.
#
# Imparatorluk bunun yerine ILISKILER uzerinden gorunuyor (world/_diplomacy.yml):
# Katolik kutup (Bavyera-Avusturya-Bohemya) ile Protestan kutup
# (Saksonya-Brandenburg-Hannover) birbirine dusman, ikisi de digerini
# yenemiyor, disaridan Lehistan ve Rum bastiriyor.

# ===========================================================================
# KATOLIK KUTUP
# ===========================================================================

# Viyana dustukten sonra tac Wittelsbach'lara gecti.
BAV:
  color: [140, 168, 208]
  country_type: recognized
  tier: kingdom
  cultures: [south_german]
  religion: catholic
  tech_tier: 3
  literacy: middling
  capital: STATE_BAVARIA
  name: Kingdom of Bavaria
  adjective: Bavarian
  name_tr: "Bavyera Krallığı"

# Rum Viyana'yi dusurdu, Lehistan Turkleri puskurttu ama ganimeti kendi aldi.
# Geriye tiknaz ama kucuk bir arsiduklu kaldi: Avusturya, Styria, Tirol.
