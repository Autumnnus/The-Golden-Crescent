version: 1
policy: >-
  Match demographic scale to the reviewed direct borders. Keep separate Mughal,
  Bengal and four Maratha treasuries; do not count dependent Kashmir or Rajput
  states as Mughal POPs. Bengal includes Bihar and therefore needs a revised
  direct-population range. Retain every inherited profession, liberated Bengal
  POP and small unlisted community from the previous identity cleanup.
