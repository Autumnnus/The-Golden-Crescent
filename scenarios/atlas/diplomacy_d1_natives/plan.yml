# D1 — decentralized native polities (user decision 25 Sep 2026).
# Only the Mesoamerican (Aztec) and Andean (Inca) states, the Muisca/Cauca highland city states,
# the colonies and colony-born states stay organised states in the Americas. Every other native
# polity of the Americas and the small Siberian councils become decentralized: their people,
# homelands and land remain theirs, but the land becomes colonizable as for vanilla natives.
