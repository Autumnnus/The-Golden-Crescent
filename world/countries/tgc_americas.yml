# Yeni Dunya. Tasarim belgesi: senaryo_amerika.md
#
# DIN TASARIMI - bu haritanin en onemli farki.
# Vanilla'da Amerika'nin butun yerli kulturleri KATOLIK cunku Ispanya ve
# Portekiz onlari zorla dondurmustu. Bu evrende sombrgeci Ispanya degil,
# cogulcu-Musluman Endulus (senaryo.md 49: "yerli devletleri tamamen ortadan
# kaldirmak yerine ... kendi somurge sistemine dahil eder"). Sonuc:
#
# KRITIK: Bu kitaya HIC Katolik misyoner gelmedi. Karayipler'e 1490'da ayak
# basan Endulusludur; ne Ispanya ne Portekiz var. Dolayisiyla:
#
#   YERLILER  animist kalir. Bir kismi 340 yilda yoneticinin mezhebine
#             (Hikmetiyye / Taklidiyye) gecti - baskiyla degil, sehirlesme ve
#             hukuk yoluyla. Katoliklik yerlilerde YOK.
#   YERLESIMCILER  Endulus cogulcu bir devlet (senaryo.md 27: Musluman,
#             Hristiyan ve Yahudi topluluklar) - gocmenlerin bir kismi Iberyali
#             Hristiyan. Katoliklik SADECE bu kadar, ve yalnizca yerlesimci
#             kulturlerinde.
#   AFRIKALI KOLELER  Musluman efendilerin yaninda kusaklar boyu Islamlasti;
#             kalani animist.
#
# Bu ayrimi yapabilmek icin `culture_religion_split` kullaniliyor: vanilla hem
# Nahua koylusunu hem Iberyali yerlesimciyi "katolik" sayiyor, biz ikisini
# ayirmak zorundayiz.

# ===========================================================================
# ENDULUS SOMURGE IMPARATORLUGU
# Uc ayri tabiiyet tipi bilerek: her biri farkli bir bagimsizlik dinamigi.
# ===========================================================================

# senaryo.md 532: "Endulus'un Meksika ve Orta Amerika'daki en buyuk somurge
# devleti. Tenochtitlan tamamen yok edilmemis, buyuk bir somurge baskentine
# donusturulmustur."  `dominion` = ozerk, en guclu, en tehlikeli.
NAN:
  color: [226, 196, 92]
  country_type: colonial
  tier: kingdom
  cultures: [nahua, spanish, mexican]
  religion: hikmatiyya
  tech_tier: 4
  literacy: low
  capital: STATE_MEXICO
  name: New Andalusia
  adjective: New Andalusian
  name_tr: "Yeni Endülüs"
  overlord: ANL
  subject_type: dominion
  liberty_desire: 65
  # Nahua: donduren olmadi, cogunluk animist; sehirli azinlik Hikmetiyye.
  # Ispanyol: Endulus'ten gelen gocmen - karisik Musluman/Hristiyan.
  # Mexican: uc yuzyillik karma somurge kulturu, cogunlukla Hikmetiyye.
  culture_religion_split:
    nahua:   {catholic: {animist: 0.68, hikmatiyya: 0.32}}
    spanish: {catholic: {hikmatiyya: 0.60, catholic: 0.40}}
    mexican: {catholic: {hikmatiyya: 0.62, animist: 0.24, catholic: 0.14}}
  religion_split:
    catholic: {animist: 0.62, hikmatiyya: 0.38}

