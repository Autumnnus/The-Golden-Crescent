version: 2
title: Nil'de Sanayi Devrimi
description: |
  Mekanikleri gösteren örnek; tamamlanmış bir dünya dengelemesi değildir.
  Mısır sanayileşir; Fransa küçülen nüfus, düşük okuryazarlık ve feodal bağlılıklarla başlar.
countries:
  EGY:
    population:
      scale: 1.25
      literacy: 0.65
      wealth: 14
    technology:
      mode: merge
      tier: 1
      add: [corporate_charters]
    laws:
      values: [law_freedom_of_conscience, law_tenant_farmers, law_public_schools]
    institutions:
      institution_schools: 2
    interest_groups:
      mode: replace
      ruling: [ig_industrialists, ig_intelligentsia]
      strength: {ig_industrialists: 0.5, ig_landowners: -0.3}
    companies:
      mode: replace
      add: [{type: company_misr, headquarters: STATE_LOWER_EGYPT}]
    military:
      mode: replace
      formations:
        - name: Nil Ordusu
          type: army
          hq_region: region_near_east
          units:
            - {type: combat_unit_type_line_infantry, state: STATE_LOWER_EGYPT, count: 25}
        - name: İskenderiye Filosu
          type: fleet
          hq_region: region_near_east
          ships:
            - {type: ship_type_frigate, state: STATE_LOWER_EGYPT, count: 5}
  FRA:
    history_mode: replace
    population: {scale: 0.8, literacy: 0.15, wealth: 9}
    industry: {mode: replace}
    technology: {mode: replace, tier: 5}
    laws:
      mode: replace
      values: [law_monarchy, law_autocracy, law_traditionalism, law_serfdom, law_no_schools]
    companies: {mode: replace}
    military: {mode: replace, formations: []}
    interest_groups:
      mode: replace
      ruling: [ig_landowners, ig_devout]
      strength: {ig_landowners: 0.5, ig_industrialists: -0.5}
  ZBR:
    name: Duchy of Brittany
    name_tr: Bretonya Dükalığı
    color: [128, 165, 143]
    country_type: recognized
    tier: principality
    cultures: [breton]
    religion: catholic
    capital: STATE_BRITTANY
    history_mode: replace
    technology: {mode: replace, tier: 5}
    population: {literacy: 0.12, wealth: 8}
    industry: {mode: replace}
    military: {mode: replace}
states:
  STATE_LOWER_EGYPT:
    population:
      total: 2500000
      composition:
        - {culture: misri, religion: sunni, share: 0.8}
        - {culture: misri, religion: oriental_orthodox, share: 0.15}
        - {culture: turkish, religion: sunni, share: 0.05}
    industry:
      mode: merge
      buildings:
        building_textile_mill: 12
        building_tooling_workshop: 6
        building_university: {level: 3, ownership: government}
        building_port: 4
  STATE_BRITTANY:
    owner: ZBR
    homelands: [breton]
subject_types:
  ve_feudal_vassal:
    base: vassal
    name: Feudal Vassal
    name_tr: Feodal Vasal
    overlord_types: [recognized, unrecognized]
    subject_types: [recognized, unrecognized]
    can_have_subjects: true
    join_overlord_wars: true
    income_transfer: 0.15
diplomacy:
  mode: inherit
  reset_countries: [FRA, ZBR, EGY]
  subjects:
    - {overlord: FRA, subject: ZBR, type: ve_feudal_vassal, liberty_desire: 25}
  relations:
    - {actor: EGY, target: FRA, value: -30}
