# --- ORTADOGU'DAKI UC TAMPON VASSAL --------------------------------------
# Rum'un Anadolu'yu disariya kapatan kusagi. Ucu de protectorate: dis
# siyasetleri Rum'da, ic isleri kendilerinde.
#
#   SYR  Misir'a karsi (senaryo.md 77, 1712 Sam Antlasmasi)
#   KUR  Fars'a karsi  (senaryo.md 660, Dogu Anadolu ve Irak rekabeti)
#   BSR  Fars'a karsi + Korfez'e cikis
#
# Ucu de Rum'un mezhebinde DEGIL - tampon olmalari bu yuzden pahali.

SYR:
  color: [98, 152, 216]
  country_type: recognized
  tier: principality
  cultures: [mashriqi]
  tech_tier: 3
  literacy: middling
  religion: taklidiyya
  capital: STATE_SYRIA
  name: Emirate of Damascus
  adjective: Damascene
  name_tr: "Şam Emirliği"
  # Lubnan tek state'lik bir noktaydi; Sam'a katildi.
  overlord: TUR
  subject_type: protectorate
  liberty_desire: 35
  religion_split:
    sunni: {taklidiyya: 0.6, mujtahidiyya: 0.4}


