# Rum Imparatorlugu ve tabiileri.
#
# senaryo.md 5: "Rum Imparatorlugu"  |  senaryo.md 102: 1818-1827 Rum Taht Savasi
# Renk semasi: Rum ve tabiileri MAVI tonlari. Fars kufesi yesil (tgc_persia.yml),
# iki blogun arasindaki tarafsiz tampon devletler amber.

# --- Metbu ---------------------------------------------------------------
TUR:
  color: [40, 84, 160]
  country_type: recognized
  tier: empire
  cultures: [turkish]
  tech_tier: 1
  literacy: high
  religion: mujtahidiyya
  capital: STATE_EASTERN_THRACE
  name: Empire of Rum
  adjective: Rumi
  name_tr: "Rûm İmparatorluğu"
  religion_map:
    sunni: mujtahidiyya

# --- Balkan kukla emirlikleri --------------------------------------------
