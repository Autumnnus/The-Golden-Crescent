version: 1
policy: 'Southern and Eastern Europe: Italy''s states, the northern Iberian kingdoms, the Balkan emirates and kingdoms,
  independent Hungary and Transylvania, the Danubian principalities, Silesia, East Prussia and Krakow. Inherited
  populations already fit the written design and keep their scale. Narrow corrections: Habsburg-era Danube Swabian
  colonisation is reduced in independent Hungary''s Banat, Backa, Bekes and Transdanubia; Russian-era colonists
  leave Bessarabia, where Budjak Nogais remain; without the Spanish expulsions northern Iberia keeps Sephardic and
  Mudejar Muslim communities; Venice, Livorno, Naples and Sicily keep small Rum, Greek, Armenian and Maghrebi merchant
  groups. Wallachian and Moldavian slave POPs (the installed stand-in for Romani bondage) stay under the vanilla
  legacy-slavery law. Weights are per mille.'
