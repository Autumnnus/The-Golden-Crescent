# Finlandiya Rusya'ya hic gecmedi; Isvec'e bagli buyuk prenslik olarak kaldi.
FIN:
  color: [124, 164, 188]
  country_type: recognized
  tier: grand_principality
  cultures: [finnish, swedish]
  religion: protestant
  tech_tier: 3
  literacy: high
  capital: STATE_UUSIMAA
  name: Grand Duchy of Finland
  adjective: Finnish
  name_tr: "Finlandiya Büyük Dukalığı"
  overlord: SWE
  subject_type: vassal
  liberty_desire: 20
  religion_split:
    protestant: {protestant: 0.66, catholic: 0.34}

