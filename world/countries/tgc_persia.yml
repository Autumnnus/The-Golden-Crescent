# Iran Sahliklari Konfederasyonu ve Rum-Fars arasindaki tampon devletler.
#
# senaryo.md 246: "Iran tek bir devlet degildir. Sahliklar ortak savunma,
# ticaret ve bilim kurumlariyla birbirlerine baglidir."
# Bu yuzden uyeler `tributary`: kendi ordularini ve diplomasilerini buyuk olcude
# korurlar, sadece Isfahan'a bagli kalirlar. Yuksek liberty_desire =
# senaryo.md 283 "Tebriz ve Horasan'in bagimsizlik egilimleri".
#
# Renk semasi: konfederasyon YESIL tonlari. Rum kufesi mavi (tgc_rum.yml).

# --- Konfederasyonun merkezi ---------------------------------------------
PER:
  color: [34, 120, 88]
  country_type: recognized
  tier: empire
  cultures: [persian]
  tech_tier: 1
  literacy: very_high
  religion: irfaniyya
  capital: STATE_ISFAHAN
  name: Shahdom of Isfahan
  adjective: Isfahani
  name_tr: "İsfahan Şahlığı"
  religion_map:
    shiite: irfaniyya

# --- Konfederasyon uyeleri -----------------------------------------------
# Tebriz Hanligi Baku'yu da tutuyor (Tebriz + Urmiye + Azerbaycan).
# Once ayri bir BAK Hanligi vardi; iki kucuk blob yerine tek tiknaz sahlik.
