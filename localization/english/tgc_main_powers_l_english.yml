 tgc_levantine_revanchism: "Levantine Revanchism"
 tgc_confederal_paralysis: "Confederal Paralysis"
 tgc_rum_second_founding: "The Second Founding of the Empire"
 tgc_treaty_of_damascus_avenged: "The Treaty of Damascus Avenged"
 tgc_federal_iran: "Federal Iran"

 je_tgc_andalusia_complete_peninsula: "Completing the Peninsula"
 je_tgc_andalusia_complete_peninsula_reason: "Las Navas was won in 1212, and the peninsula has been divided ever since. Cordoba holds the south, the west and the centre; the north remains a patchwork of Christian kingdoms that answer to no caliph and increasingly to London. A federal caliphate can absorb them without unmaking them — that is the whole claim of Hikmatiyya. Prove it on the peninsula before proving it across the ocean."
 je_tgc_andalusia_complete_peninsula_complete_tt: "We hold #b Old Castile, Leon, Asturias, Galicia, Aragon, Catalonia#! and the #b Basque Country#!"

 je_tgc_poland_new_path: "Europe's New Path"
 je_tgc_poland_new_path_reason: "We took our artillery drill from Rum, our chancery from the Tatars, and our tolerance from necessity. It has made us the most reformed state in Europe and still not an industrial one. Vienna is feudal, Paris is five kingdoms, and Britain is looking east for its lessons. Europe will be led by whoever teaches it — so teach it."
 je_tgc_poland_new_path_complete_tt: "Literacy above #b 60%#! and the rank of #b Great Power#!"

 je_tgc_uyghur_silk_road: "Master of the Silk Road"
 je_tgc_uyghur_silk_road_reason: "Kashgar holds the eastern gate and Bukhara the western, and everything between them pays someone else's toll. China is five states and cannot close the road; Isfahan is a confederation and cannot open it. The caravans are already ours in everything but law."
 je_tgc_uyghur_silk_road_complete_tt: "We hold #b Tianshan, Khiva, Bukhara#! and #b Fergana#!"

 je_tgc_tabriz_leave_assembly: "Leaving the Assembly"
 je_tgc_tabriz_leave_assembly_reason: "The confederation of 1815 was a splint, not a spine. Tabriz pays tribute to Isfahan, fights Isfahan's wars on the Rumi border, and is consulted on neither. Our workshops out-produce theirs and our jurists out-argue theirs. A shahdom that can stand should not be carried."
 je_tgc_tabriz_leave_assembly_complete_tt: "We answer to no overlord"

