version: 1
policy: >-
  Keep the independent Indian treasuries, their inherited regional culture/religion
  communities, and H8 bonded professions. Make modest population corrections from
  the installed source. Replace surviving European colonial administrators and
  aristocrats with local officers of the same profession; ordinary settlers and
  private investors are not automatically removed. City estimates are subsets of
  the corresponding state-owner POP and are not additional population.
