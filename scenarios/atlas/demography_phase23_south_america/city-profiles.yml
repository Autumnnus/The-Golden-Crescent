# Design subsets of verified state/owner POPs; not extra city POPs.
# Installed Turkish hub labels and province owners are verified by verify.py.
# Profiled names come from local languages (Quechua, Aymara, Muisca, Tupi, Mapudungun...) or
# are used by the written Americas design itself (Recife, Rio, Buenos Aires, Montevideo,
# Cartagena, Cusco). Castilian and Portuguese colonial foundation names in local territory
# (Asuncion, Santiago, Belem, Sao Paulo, La Paz...) are left unprofiled.
