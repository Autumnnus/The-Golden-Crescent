# 05_north_america.txt bolgesindeki state atamalari
# Elle duzenlenir. Oyun dosyalari: python tools/tgc.py build
#
# Bkz. senaryo_amerika.md. Uc kural:
#   1) Avrupalilar kiyida, yerliler iceride
#   2) ABD yok - on uc koloni hic birlesmedi
#   3) Yerli devletler gercek devlet, kabile degil (senaryo.md 592)
#
#   SW1/NW1  Kalmar kolonileri (senaryo.md 563)
#   NEN/VRG  Britanya kolonileri (senaryo.md 557)
#   NNL      Yeni Hollanda - Nieuw Amsterdam hic dusmedi
#   PEN      Pennsylvania - Alman ve Hollandali yerlesimcilerin cumhuriyeti
#   YEN      Yeni Bursa, Rum kolonisi (senaryo.md 574)
#   OJI/IRO/ILL/CHE/CRK/CTW/SEQ  yerli konfederasyonlar
#   LKT/PWN/ARP/CMN/SLS          Buyuk Ovalar
#   SLS/UTE/APC/BNN/ATB          bati ve Alaska: kolonilesmemis

