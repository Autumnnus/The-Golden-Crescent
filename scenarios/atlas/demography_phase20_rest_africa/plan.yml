version: 1
policy: After the separately verified Oranje/Transvaal owner transfer, keep separate Kongo, Luba-Lunda, Madagascar, Mozambique,
  Zulu, Xhosa, Tswana and southwestern polities. Apply modest 2-4% population targets and differentiated literacy. Preserve
  inherited joint faith/culture groups and explicit professions, except four southern state-owner mixes where inherited British/Boer
  settler shares imply a colonial state absent from the scenario; retain small foreign and local Protestant communities. No
  further border or diplomacy changes. Partial country totals cover only listed shares.
