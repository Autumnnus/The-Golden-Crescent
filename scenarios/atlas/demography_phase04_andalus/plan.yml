policy: >-
  The target is direct VAN population: 16.24 million on the Iberian mainland
  and 1.26 million in directly owned Atlantic islands. Dependent American
  countries are not counted. Arabic-speaking Andalusi, Romance-speaking
  Muslim and Christian, Jewish and Maghrebi communities remain distinct.
  Existing slave and fixed-profession POPs retain exact identity and size.
  Hikmetiyye is a legal tradition, not a POP religion; Muslims use the
  installed sunni religion until the legal/institutional phase.
