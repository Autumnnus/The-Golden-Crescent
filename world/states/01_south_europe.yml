# Italya limanlari. Sardinya Rum'un Bati Akdeniz ussu.
STATE_SARDINIA: {owner: TUR, pops: inherit, buildings: inherit}
# Sicilya Emirligi adanin tamamina hakim; yalnizca bogazin dogu ucundaki
# Messina Rum'da - Messina Bogazi'ni kontrol eden kucuk bir garnizon sehri.
STATE_SICILY:
  split:
  - owner: TUR
    provinces: [x00D020]
  - {owner: SIC, rest: true}
  pops: inherit
  buildings: inherit
