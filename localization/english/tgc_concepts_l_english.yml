l_english:
 concept_tgc_ijtihad_wars: "Great Ijtihad Wars"
 concept_tgc_ijtihad_wars_desc: "The wars of 1664–1712, fought over whether religious law could be reinterpreted for a changing world. Egypt and the Hejaz led the traditionalists; Rum and the Iranian states led the reformists, with al-Andalus funding them without ever declaring war. Egypt lost. The Treaty of Damascus in 1712 stripped it of Syria, limited it in Palestine, ceded the eastern Mediterranean islands to Rum and forced it to recognise the reformist schools — but left its fleet and its trade empire untouched. Every border, faith and rivalry in the Islamic world of 1836 dates from that settlement."

 concept_tgc_three_minbars: "Crisis of the Three Minbars"
 concept_tgc_three_minbars_desc: "There is no single accepted religious leadership in the Islamic world. Cairo holds that the Caliph wields both spiritual and temporal authority over every Muslim state. Cordoba treats the caliphate as leadership in law, science and letters rather than a seat of government. Rum and Isfahan reject the universal caliphate altogether, holding that religious authority belongs to national and regional institutions. Most Muslim states outside these three orbits have committed to none of them — and are the ground all three are fighting over."

 concept_tgc_mujtahidiyya: "Mujtahidiyya"
 concept_tgc_mujtahidiyya_desc: "The official school of the Empire of Rum, widespread also in the Balkans, Central Asia and the Gurkani lands. It defends the right of independent reasoning over imitation of precedent, permits state law to separate partly from religious law, prizes scientific and technical education, and denies the clergy direct political rule."

 concept_tgc_irfaniyya: "Irfaniyya"
 concept_tgc_irfaniyya_desc: "The reformist Shia tradition of the Iranian states. It seeks a synthesis of philosophy, mysticism, science and law, and holds strong influence over the universities and scientific academies of Iran."

 concept_tgc_taklidiyya: "Taqlidiyya"
 concept_tgc_taklidiyya_desc: "The traditionalist school of Egypt, the Hejaz and Arabia. It defends the established schools of law, the authority of the ulema and the institution of the caliphate. It is not hostile to technology, but insists that social and legal reform be supervised by religious authority."

 concept_tgc_hikmatiyya: "Hikmatiyya"
 concept_tgc_hikmatiyya_desc: "The pluralist reform movement particular to al-Andalus. It argues that Muslim, Christian and Jewish communities can live within a single political structure, and is strongest among urban merchants, academics and bureaucrats."
