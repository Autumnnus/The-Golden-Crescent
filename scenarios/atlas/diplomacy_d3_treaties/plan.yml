# D3 — 1836 starting treaties and rivalries (user decisions 25 Sep 2026; canon: docs/scenario/diplomasi.md §2-4).
# Treaties are outside Atlas; build.py writes common/history/treaties/tgc_scenario_treaties.txt.
# Rivalries are Atlas `diplomacy.pacts` (prepare.py). Articles: mutual = alliance, defensive_pact;
# directed (source -> target) = guarantee_independence, trade_privilege, military_access, transit_rights.
version: 1
# Vanilla treaties that make no sense in this world (Congress of Vienna guarantees; the London
# crown's Caribbean dependencies holding Johor's port or guaranteeing Griqua states).
drop_vanilla:
  - [AUS, SIC]
  - [AUS, TUS]
  - [AUS, PAR]
  - [AUS, MOD]
  - [JOH, GBR]
  - [GBR, PHL]
  - [GBR, WBL]
treaties:
  # P4 (26 Sep 2026): Tabriz is Isfahan's puppet; an overlord and its subject cannot hold an alliance.
  - {name: Kalmar Deniz Ahdi, first: DEN, second: SWE, date: 1755.6.1, years: 100, articles: [{article: defensive_pact}]}
  - {name: Kalmar Deniz Ahdi, first: DEN, second: NOR, date: 1755.6.1, years: 100, articles: [{article: defensive_pact}]}
  - {name: Kalmar Deniz Ahdi, first: SWE, second: NOR, date: 1755.6.1, years: 100, articles: [{article: defensive_pact}]}
