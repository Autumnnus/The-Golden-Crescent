# 01_south_europe.txt bolgesindeki state atamalari
# Elle duzenlenir. Oyun dosyalari: python tools/tgc.py build
#
# Balkanlar uc halka:
#   1) Rum dogrudan (Rumeli eyaletleri): Trakya, Makedonya, Uskup, Teselya,
#      Yunanistan, Ege ve Girit. Homeland'ler vanilla kaliyor -> Balkan
#      milliyetciligi senaryo sorunu olarak yasiyor (senaryo.md 193).
#   2) Musluman kukla emirlikler: BOS, ALB, BUL  (bkz. world/countries/tgc_rum.yml)
#   3) Bagimsiz Hristiyan kuzey: SER, WAL, MOL, CRO, HUN, TRS
#      -> 1818-1827 Taht Savasi koalisyonu (senaryo.md 102)

