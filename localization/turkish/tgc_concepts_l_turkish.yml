l_turkish:
 concept_tgc_ijtihad_wars: "Büyük İçtihat Savaşları"
 concept_tgc_ijtihad_wars_desc: "1664-1712 arasında, dinî hukukun değişen dünyaya göre yeniden yorumlanıp yorumlanamayacağı üzerine verilen savaşlar. Gelenekçilerin başını Mısır ve Hicaz, reformistlerin başını Rûm ve İran devletleri çekti; Endülüs savaşa hiç girmeden reformistleri finanse etti. Mısır yenildi. 1712 Şam Antlaşması onu Suriye'den etti, Filistin'de sınırladı, Doğu Akdeniz adalarının bir kısmını Rûm'a bıraktırdı ve reformist mezhepleri resmen tanımaya zorladı — ama donanmasına ve ticaret imparatorluğuna dokunmadı. 1836 İslam dünyasındaki her sınır, her mezhep ve her rekabet o antlaşmadan kalmadır."

 concept_tgc_three_minbars: "Üç Minber Krizi"
 concept_tgc_three_minbars_desc: "İslam dünyasında kabul edilmiş tek bir dinî liderlik yok. Kahire, halifenin her Müslüman devlet üzerinde hem dinî hem siyasi otoriteye sahip olduğunu savunuyor. Kurtuba halifeliği bir yönetim makamı değil, hukukta, bilimde ve edebiyatta liderlik olarak görüyor. Rûm ve İsfahan evrensel halifelik fikrini bütünüyle reddedip dinî otoritenin ulusal ve bölgesel kurumlara ait olduğunu söylüyor. Bu üç yörüngenin dışındaki Müslüman devletlerin çoğu hiçbirine bağlanmış değil — ve üçünün de kavga ettiği zemin tam olarak orası."

 concept_tgc_mujtahidiyya: "Müçtehidiyye"
 concept_tgc_mujtahidiyya_desc: "Rûm İmparatorluğu'nun resmî mezhebi; Balkanlar, Orta Asya ve Gurkanî topraklarında da yaygın. Taklit yerine içtihadı savunur, devlet hukukunun dinî hukuktan kısmen ayrılmasına izin verir, bilimsel ve teknik eğitime önem verir, ulemanın doğrudan siyasi yönetimini reddeder."

 concept_tgc_irfaniyya: "İrfaniyye"
 concept_tgc_irfaniyya_desc: "İran devletlerinin reformist Şii geleneği. Felsefe, tasavvuf, bilim ve hukuk arasında bir sentez kurmaya çalışır; İran'daki üniversiteler ve bilim akademileri üzerinde güçlü etkisi vardır."

 concept_tgc_taklidiyya: "Taklidiyye"
 concept_tgc_taklidiyya_desc: "Mısır, Hicaz ve Arabistan'ın gelenekçi mezhebi. Yerleşik mezhepleri, ulema otoritesini ve halifelik kurumunu savunur. Teknolojiye karşı değildir ama sosyal ve hukuki reformların dinî otorite tarafından denetlenmesini ister."

 concept_tgc_hikmatiyya: "Hikmetiyye"
 concept_tgc_hikmatiyya_desc: "Endülüs'e özgü çoğulcu reform hareketi. Müslüman, Hristiyan ve Yahudi toplulukların aynı siyasi yapı içinde yaşayabileceğini savunur; şehirli tüccarlar, akademisyenler ve bürokratlar arasında güçlüdür."
