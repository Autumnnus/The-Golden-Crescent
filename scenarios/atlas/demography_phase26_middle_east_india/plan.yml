version: 1
policy: >-
  Middle East outside Rum, Egypt and Iran, plus the last Indian and Indian Ocean shares. The
  Rum-bound atabegates, Kurdistan, the Levant emirates, Arabia, Yemen and the Gulf keep their
  inherited local joint culture/faith groups at modestly higher Levantine/Mesopotamian scale
  (better irrigation and storage in the written design). Lebanon's inherited faith mix is
  corrected toward its Maronite/Druze mountain order. H8 dynasties that hold inherited household
  slaves receive the Sennar precedent law_debt_slavery; the H7 Basra merchant republic releases its
  slaves. Danish Tranquebar is absorbed by the Tamil kingdom; its existing plan is kept and the
  frozen Tranquebar POPs are added. Weights are per mille.
