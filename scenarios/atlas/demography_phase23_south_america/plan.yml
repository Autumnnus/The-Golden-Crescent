country_culture_overrides:
  SPU: {from: [south_andean], to: [quechua]}              # Cusco highlands, no Spanish Peru
  NPU: {from: [south_andean], to: [quechua, south_andean]}  # Lima trade coast with creole merchants
  PRG: {from: [platinean, guarani], to: [guarani]}
  URU: {from: [platinean], to: [patagonian, guarani]}       # Charrua/Chana stand-in and Guarani
  PRA: {from: [amazonic], to: [tupinamba, amazonian]}
  PNI: {from: [sulista], to: [guarani]}
  VCS: {from: [chilean], to: [patagonian, south_andean]}    # Picunche valleys and creole ports
  VOR: {from: [muisca], to: [amazonian]}                    # Orinoco Arawakan/Guahibo peoples
  VCU: {from: [quechua], to: [quechua, aimara]}
  VKC: {from: [quechua], to: [quechua, aimara]}
  VLP: {from: [quechua], to: [aimara, quechua]}
  VAK: {from: [quechua], to: [aimara, quechua]}
# `from: null` means the vanilla religion was derived from the old primary culture.
