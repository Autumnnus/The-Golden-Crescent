# FILIPINLER: vanilla'da Ispanyol somurgesi ve butun Filipin kulturleri
# KATOLIK. Bu evrende Ispanya hic kurulmadi, dolayisiyla 1565 fethi de hic
# olmadi. Manila Musluman bir racaligin merkezi olarak kaldi; adalarin
# ic kesimi animist.
TND:
  color: [162, 132, 178]
  country_type: unrecognized
  tier: kingdom
  cultures: [tagalog, visayan]
  religion: sunni
  tech_tier: 5
  literacy: baseline
  capital: STATE_LUZON
  name: Rajahnate of Tondo
  adjective: Tondo
  name_tr: "Tondo Racalığı"
  # Ispanyol misyoner gelmedi: Katoliklik yok, kiyilar Musluman, ic kesim animist.
  culture_religion_split:
    tagalog: {catholic: {sunni: 0.55, animist: 0.45}}
    visayan: {catholic: {animist: 0.75, sunni: 0.25}}
  religion_split:
    catholic: {animist: 0.7, sunni: 0.3}

