    - {actor: UBD, target: VPL, value: -25}
    - {actor: KSG, target: NCH, value: -60}
    - {actor: AUS, target: VPL, value: -40}
    - {actor: AUS, target: HUN, value: -30}
    - {actor: HUN, target: TRS, value: 60}
