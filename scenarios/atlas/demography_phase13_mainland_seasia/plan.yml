version: 1
policy: >-
  Set modest direct-population and literacy inputs for mainland Southeast Asia.
  Preserve all inherited joint culture/religion communities and explicit
  professions. Keep Burma, Siam, Dai Nam, Shan, Lao and Khmer polities separate;
  do not turn Egyptian/Omani port contracts into territorial ownership.
province_transfer:
  state: STATE_PEGU
  province: xB030A0
  old_owner: DEN
  new_owner: BUR
  reason: >-
    The inherited Danish enclave contradicts the written atlas's removal of
    Western Christian territorial control in Southeast Asia. Both its province
    and 9,102 Mon/animist residents pass to Burma; Denmark elsewhere is intact.
