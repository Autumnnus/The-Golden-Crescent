version: 1
policy: >-
  South America without an Iberian conquest. The Andean kingdoms (Quito, Cusco, Charcas) and
  the Muisca, Guarani, Mapuche, Pampa and Amazon polities start with their own peoples and
  local faiths; the installed Hispanophone/Lusophone settler cultures remain only as small
  creole trader communities tied to Andalusian and Moroccan commerce. Moroccan Brazil and New
  Ishbiliya keep legal slavery with preserved slave counts re-identified across Muslim, local
  and Christian Africans; Rio de Janeiro's Portuguese-capital slave count is reduced to the
  smaller separate settlement network of the written design. Dutch Guiana gains the enslaved
  population that its written H10 exception implies. Venezuela and Lima keep their inherited
  creole identity and slavery law. Local (H9) polities release slave POPs.
  Weights are per mille of the non-fixed remainder; slave_mix re-identifies preserved slaves.
