# Cin'in bes devleti.
#
# senaryo.md 494: "Cing yonetimi 18. yuzyilda ekonomik krizler, saray savaslari
# ve Uygur isyanlari sonucunda cokmustur."
# senaryo.md 522: "Her Cin devleti ulkeyi yeniden birlestirme hakkina sahip
# oldugunu iddia eder."
#
# Renk semasi: Cin kendi ailesi. Kuzey imparatorluk sarisi, Jiangnan yesim,
# Shu arduvaz, Yue mercan, Mancurya zeytin.
#
# country_type ayrimi senaryoya dayaniyor: Kuzey Cin geleneksel merkez,
# Jiangnan ise "Cin'in ekonomik ve teknolojik olarak en gelismis bolgesi"
# (senaryo.md 506) - ikisi tanininan guc. Digerleri henuz degil.

CHI:
  color: [206, 168, 74]
  country_type: recognized
  tier: empire
  cultures: [han, manchu]
  religion: confucian
  tech_tier: 4
  literacy: low
  capital: STATE_BEIJING
  name: Northern Chinese Empire
  adjective: Northern Chinese
  name_tr: "Kuzey Çin İmparatorluğu"

