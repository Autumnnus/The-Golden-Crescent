 je_group_tgc_three_minbars: "The Crisis of the Three Minbars"

 # --- Journal entries ------------------------------------------------------
 # NOT: JE aciklama anahtari `_desc` degil `_reason` (vanilla: je_age_of_princes_reason)
 je_tgc_cairo_caliphate: "The Caliphate of Cairo"
 je_tgc_cairo_caliphate_reason: "The Caliph in Cairo claims spiritual and temporal authority over every Muslim polity. Since the defeat of 1712 that claim has rested on assertion rather than obedience. The ulema of al-Azhar must carry it abroad — to the Maghreb, to the steppe, to the Indies — before the reformers make it a memory."
 je_tgc_cairo_caliphate_complete_tt: "At least #b 26#! states follow the minbar of Cairo (currently 16)"
 je_tgc_cairo_caliphate_fail_tt: "We have abandoned Taqlidiyya"

 je_tgc_cordoba_caliphate: "The Caliphate of Cordoba"
 je_tgc_cordoba_caliphate_reason: "Cordoba does not command; it attracts. The Caliph claims leadership in law, science and letters rather than obedience in politics. A minbar that rules nothing may yet outlast one that rules badly — but only if someone is listening."
 je_tgc_cordoba_caliphate_complete_tt: "At least #b 10#! states follow the minbar of Cordoba (currently 2)"
 je_tgc_cordoba_caliphate_fail_tt: "We have abandoned Hikmatiyya"

 je_tgc_ijtihadi_order: "The Ijtihadi Order"
 je_tgc_ijtihadi_order_reason: "Rum and Isfahan reject the universal caliphate outright. Religious authority belongs to national and regional institutions, answerable to the state and to the age. It is not a claim to the minbar — it is a proposal to dismantle it. Prove the proposal works."
 je_tgc_ijtihadi_order_complete_tt: "At least #b 32#! states follow the Ijtihadi Order (currently 21)"
 je_tgc_ijtihadi_order_fail_tt: "We have abandoned the Ijtihadi schools"

