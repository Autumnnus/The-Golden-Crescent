version: 1
scope: >-
  Thirty-seven landed minor Indian states in the 1836 political map, including
  both Chitral shares (Kashmir and Central Asian Pashtunistan), and excluding
  Burmese border polities (BUR, SHS, SIA, KKI, DEN) and Mascarene VMB. The
  six core and fifteen larger Indian countries keep their earlier exact plans.
policy: >-
  Set modest direct-country totals from the reviewed political borders; keep
  each inherited local joint culture/religion community and exact bonded
  profession count. No court faith is imposed on the population. Literacy is
  a state-owner preparation input, not measured engine literacy. Do not merge
  autonomous members into Mughal, Bengal, Maratha or Hyderabad treasuries.
