partial_countries: [GBR, DEN, NET, VNZ]
country_culture_overrides:
  VNE: {from: [nahua], to: [nahua, mexican]}      # Nahua dynasties and the New Andalusian creoles
  VBJ: {from: [nahua], to: [nahua, tarascan]}
  VBP: {from: [nahua], to: [hokan]}               # Yuman/Guaycura Baja peoples
  VDR: {from: [nahua], to: [oodham]}              # Tepehuan-speaking highlands
  VSO: {from: [nahua], to: [oodham]}              # Yaqui, Mayo, O'odham
  VSR: {from: [nahua], to: [nahua, oodham]}       # Nahua towns among the northern peoples
  VNP: {from: [apache], to: [apache, oodham]}     # Raramuri beside the Apache
  VSS: {from: [mayan], to: [nahua]}               # Pipil Cuzcatlan
  VNC: {from: [mayan], to: [nahua, miskito]}      # Nicarao lake towns and the Miskito coast
  VKR: {from: [mayan], to: [muisca]}              # Chibchan Bribri/Cabecar/Huetar stand-in
  VLE: {from: [afro_caribbean], to: [afro_antillean]}  # French-creole former French islands
  VWI: {from: [afro_caribbean], to: [afro_antillean]}
country_laws:
  VPI: [law_legacy_slavery]   # hukuk H10: slavery legal in the Pearl Islands
release_slaves:
- STATE_NICARAGUA/VNC
- STATE_PANAMA/VIT
slave_mix:
  default_pearl_islands: &pearl_slaves {afro_caribeno/catholic: 500, afro_caribeno/sunni: 250,
                                        afro_caribeno/animist: 250}
homeland_rule:
  new_share: 0.10
  keep_share: 0.01
  settler_keep_share: 0.10
  settler_cultures: [mexican, central_american, caribeno, afro_caribeno, afro_caribbean, afro_antillean,
                     british, french, dutch, danish, spanish, north_andean, afro_brazilian]
