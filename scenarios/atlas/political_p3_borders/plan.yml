  subjects:
    - {overlord: HUN, subject: CRO, type: puppet, liberty_desire: 35}
    - {overlord: VPL, subject: WAL, type: protectorate, liberty_desire: 40}
    - {overlord: VTA, subject: KZH, type: protectorate, liberty_desire: 50}   # Tatar tribute (vanilla protectorate)
    - {overlord: VTA, subject: VST, type: protectorate, liberty_desire: 45}
    - {overlord: MOR, subject: VTB, type: colony, liberty_desire: 40}
    - {overlord: MOR, subject: VFA, type: colony, liberty_desire: 40}
    - {overlord: VAN, subject: VAG, type: colony, liberty_desire: 40}
