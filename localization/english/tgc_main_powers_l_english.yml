l_english:
 je_group_tgc_main_powers: "The Ambitions of the Great Powers"

 je_tgc_rum_recall_atabegs: "Recalling the Atabegs"
 je_tgc_rum_recall_atabegs_reason: "The succession war of 1818 cost us more than the northern Balkans. While the court fought itself, the atabegs of Adana, Erzurum and Trebizond quietly stopped answering letters. They still send tribute, and they still call themselves ours — but a governor who negotiates is no longer a governor. Bind them properly, or in a generation they will be neighbours."
 je_tgc_rum_recall_atabegs_complete_tt: "None of the three atabegates remain mere #b tributaries#!"

 je_tgc_egypt_revenge_of_damascus: "The Revenge of Damascus"
 je_tgc_egypt_revenge_of_damascus_reason: "In 1712 our envoys signed away Syria at Damascus, and the reformists have held it ever since through a client emirate that speaks Cairo's language and takes Konstantiniyye's orders. The fleet was never defeated. The treasury was never emptied. What was lost was a province, and provinces can be retaken."
 je_tgc_egypt_revenge_of_damascus_complete_tt: "We control all of #b Syria#!, #b Aleppo#! and #b Palestine#!"

 je_tgc_persia_assembly_of_shahs: "The Assembly of the Shahs"
 je_tgc_persia_assembly_of_shahs_reason: "The confederation was built in 1815 to keep Iran from shattering, and it worked — at the price of a centre that cannot decide anything. Every shah keeps his own army, his own customs, his own foreign policy. Tabriz and Khorasan are already halfway out the door. Turn the assembly into a federation before it turns into a memory."
 je_tgc_persia_assembly_of_shahs_complete_tt: "At least #b 4#! shahdoms have accepted a binding tie closer than tribute"

