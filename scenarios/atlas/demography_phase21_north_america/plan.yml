version: 1
policy: >-
  North America outside Andalusian Mexico. Coastal colonies keep settler majorities with modest
  1836 totals; Vinland and New Netherland regain Nordic and Dutch settler identities instead of
  inherited French-Canadian and US Yankee ones. Interior local polities replace the inherited
  US/Canadian settler flood with their own peoples at the user's chosen moderate level
  (about 4.8 million people), keeping small trader, settler and free Afro-American communities.
  Slave POPs are kept only where the written law keeps slavery legal (Virginia; Potomac, which
  is outside the 1808-1820 abolition list); elsewhere H7/H9/1820 abolition releases them.
  Weights are per mille and describe the non-fixed remainder of a share.
countries:
  VNI: {literacy_range: [0.50, 0.52]}
