version: 1
policy: >-
  Andalusian America: Mexico, Central America and the Caribbean. New Andalusia keeps a Nahua
  majority under an Andalusian colonial charter; the installed Hispanophone settler cultures
  (mexican, central_american, caribeno) stand in for the Romance/Arabic creole communities of
  the Andalusian colonies and are split between Sunni and Catholic faiths. Local councils
  outside the charter core (the Mexican interior, the Maya and Central American assemblies)
  start with their own peoples, keeping smaller creole trader and miner communities. Religion
  follows the written rule that an Andalusian flag does not make every local person Muslim:
  local faiths remain the majority outside the core, with community-level Muslim and Christian
  conversions. Pearl Islands slavery stays legal: the inherited slave count is preserved but
  split between Catholic, Muslim and local-faith Africans, and Jamaica becomes an Andalusian
  plantation island. Local councils without slavery law release their few slave POPs.
  Weights are per mille of the non-fixed remainder; slave_mix re-identifies preserved slaves.
