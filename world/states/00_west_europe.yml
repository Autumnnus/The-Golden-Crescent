# ===========================================================================
# ORTA AVRUPA - Viyana'nin dusmesinden sonra
# ===========================================================================
# senaryo.md 406: "Bavyera imparatorluk makamini kontrol eder. Habsburglar
# hicbir zaman Avrupa'nin hakim hanedani haline gelememistir."
# Sebebi: Rum Viyana'ya kadar geldi ve sehri dusurdu. Habsburglar prestijini
# kaybetti, tac Wittelsbach'lara gecti. Turkleri Lehistan puskurttu ve
# ganimeti de Lehistan aldi - Silezya ve Galicya bugun Varsova'da.
#
# Avusturya toparlandi: tek state'lik uc ayri devlet (Avusturya, Styria,
# Tirol) yerine tiknaz bir arsiduklu.
STATE_AUSTRIA: {owner: AUS, pops: inherit, buildings: inherit}
STATE_STYRIA: {owner: AUS, pops: inherit, buildings: inherit}
STATE_TYROL: {owner: AUS, pops: inherit, buildings: inherit}
STATE_SOUTH_TYROL: {owner: AUS, pops: inherit, buildings: inherit}

# Bohemya ayri kralligini korudu: Almanya'nin en zengin topragi, Katolik.
STATE_BOHEMIA: {owner: BOH, pops: inherit, buildings: inherit}
STATE_MORAVIA: {owner: BOH, pops: inherit, buildings: inherit}

# Brandenburg secmen prensligi. PRUSYA HIC KURULMADI: gercek tarihte Dukalik
# Prusyasi 1657'ye kadar Lehistan'in fiefiydi ve Brandenburg-Prusya'nin
# yukselisi tam olarak o bagi koparmasiyla basladi. senaryo.md 330'un guclu
# Lehistan-Litvanya'si varken o kopus hic olmadi - Dogu ve Bati Prusya
# bugun Varsova'da (bkz. world/states/02_east_europe.yml).
STATE_BRANDENBURG: {owner: BAN, pops: inherit, buildings: inherit}

