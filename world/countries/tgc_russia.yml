# Moskova Buyuk Prensligi ve kuzeyin geri kalani.
#
# senaryo.md 477-490: "Rusya birlesememistir. Moskova batida Lehistan, kuzeyde
# Kalmar, guneyde Tatar devletleri, doguda bagimsiz Sibirya halklari tarafindan
# cevrilmistir. Kirim Hanligi ve Buyuk Tatar Hanligi varliklarini
# korumaktadir. Ruslarin Sibirya'ya ilerleyisi buyuk olcude durdurulmustur."
#
# Yani burada bir Rus imparatorlugu yok; ic Rusya'da sikismis, uc kucuk
# vassaliyla ayakta duran bir buyuk prenslik var.

RUS:
  color: [96, 112, 96]
  country_type: recognized
  tier: grand_principality
  cultures: [russian]
  religion: orthodox
  tech_tier: 4
  literacy: very_low
  capital: STATE_MOSCOW
  name: Grand Principality of Moscow
  adjective: Muscovite
  name_tr: "Moskova Büyük Prensliği"

# --- Moskova'nin vassallari -------------------------------------------------
# Novgorod kuzey ticaretini, Mordva ve Mari Volga halklarini temsil ediyor.
# Uc de vassal: Moskova'nin dis siyasetine bagli ama ic isleri kendilerinde.

NOV:
  color: [148, 150, 164]
  country_type: recognized
  tier: principality
  cultures: [russian]
  religion: orthodox
  tech_tier: 4
  literacy: low
  capital: STATE_NOVGOROD
  name: Republic of Novgorod
  adjective: Novgorodian
  name_tr: "Novgorod Cumhuriyeti"
  overlord: RUS
  subject_type: vassal
  liberty_desire: 55

MRD:
  color: [128, 148, 116]
  country_type: recognized
  tier: principality
  cultures: [mordvin]
  religion: orthodox
  tech_tier: 5
  literacy: very_low
  capital: STATE_TAMBOV
  name: Mordvin Principality
  adjective: Mordvin
  name_tr: "Mordva Prensliği"
  overlord: RUS
  subject_type: vassal
  liberty_desire: 25

MRI:
  color: [156, 168, 120]
  country_type: recognized
  tier: principality
  cultures: [mari]
  religion: orthodox
  tech_tier: 5
  literacy: very_low
  capital: STATE_CHUVASHIA
  name: Mari Principality
  adjective: Mari
  name_tr: "Mari Prensliği"
  overlord: RUS
  subject_type: vassal
  liberty_desire: 25

# --- Kalmar Birligi'nin dogu kanadi -----------------------------------------
