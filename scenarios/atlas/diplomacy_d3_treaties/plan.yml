  - {name: Maratha Konseyi, first: MAR, second: IND, date: 1818.1.1, years: 30, articles: [{article: defensive_pact}]}
  - {name: Maratha Konseyi, first: MAR, second: NAG, date: 1818.1.1, years: 30, articles: [{article: defensive_pact}]}
  # P3 (25 Sep 2026): Hamburg, Bremen and Lübeck form one Hanseatic League; the Hansa pacts are gone.
