# 03_north_africa.txt bolgesindeki state atamalari
# Elle duzenlenir. Oyun dosyalari: python tools/tgc.py build
#
# senaryo.md 639: Misir - Dogu Afrika kiyilari, Kizildeniz adalari,
# Hint Okyanusu ticaret usleri.
# senaryo.md 584: "Fas, Endulus'ten bagimsizligini kazandiktan sonra Brezilya
# kiyilarinda kendi kolonilerini kurmustur. Fas'in amaci Endulus'un Atlantik
# ticaret tekelini kirmaktir."
#
# MAGRIP TASARIMI: vanilla'da bolge bir dizi kucuk beylige bolunmus
# (Mascara, Constantine, Ait Abbas, Zwaya, Tibesti, Fezzan...). Senaryoda
# Magrip Endulus'un guney komsusu ve Kahire ile Kurtuba'nin cekistigi saha;
# uc tutarli devlete toplandi:
#
#   MOR  Fas Sultanligi     - Atlantik'te Endulus'un rakibi
#   MAS  Cezayir Emirligi   - Oran, Cezayir, Konstantin tek elde
#   TUN  Tunus Beyligi      - Kahire'ye yakin
#   TRI  Trablusgarp        - Misir'in bati kapisi
#
# Sahra'nin Tuareg konfederasyonlari (TUA, MZB, AHG, AJJ...) vanilla halinde:
# onlar devlet degil kabile birlikleri, senaryo da onlara deginmiyor.

