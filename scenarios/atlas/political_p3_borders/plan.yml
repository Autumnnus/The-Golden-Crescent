# Muslim Andalusian America. Christian rows of the listed owners convert to Sunni Islam except a
# `keep` fraction (the Andalusian Christian minority); where a `target` Muslim share is given, local
# faiths convert further until it is reached. Owners' every American share is processed.
religion:
  owners: [VPI, VFA, VSI, VNE, VGZ, VSS, VNC, VMY]
  keep: 0.15
  targets:
    STATE_HAITI: 0.72
    STATE_SANTO_DOMINGO: 0.72
    STATE_PUERTO_RICO: 0.72
    STATE_JAMAICA: 0.72
    STATE_WESTERN_CUBA: 0.72
    STATE_CENTRAL_CUBA: 0.72
    STATE_EASTERN_CUBA: 0.72
    STATE_WEST_INDIES: 0.70
    STATE_ZULIA: 0.62
    STATE_MIRANDA: 0.65
    STATE_ANTIOQUIA: 0.58
    STATE_BOLIVAR: 0.40
    STATE_MEXICO: 0.60
    STATE_VERACRUZ: 0.55
# Added Muslim communities (share of the owner's share); other rows shrink in proportion.
communities:
  - state: STATE_FUJIAN          # Zaitun (Quanzhou): the medieval Muslim merchant port
    owner: YUE
    rows:
      - {culture: han, religion: sunni, share: 0.040}
      - {culture: persian, religion: sunni, share: 0.004}
      - {culture: mashriqi, religion: sunni, share: 0.004}
  - state: STATE_GANSU           # Uyghur garrisons and Hui of the Hexi corridor
    owner: KSG
    rows:
      - {culture: uighur, religion: sunni, share: 0.06}
      - {culture: han, religion: sunni, share: 0.06}
