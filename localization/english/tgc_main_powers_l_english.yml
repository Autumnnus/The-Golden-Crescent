 tgc_iberia_united: "The Peninsula United"
 tgc_europes_new_path: "Teacher of Europe"
 tgc_master_of_the_silk_road: "Master of the Silk Road"
 tgc_tabriz_sovereign: "Tabriz Sovereign"

 je_tgc_mandate_of_heaven: "The Mandate of Heaven"
 je_tgc_mandate_of_heaven_reason: "The Qing fell to bankruptcy, palace war and the Uyghur revolts, and what replaced them was five states each holding a piece of the argument. Beijing keeps the rites, Nanjing keeps the money, Sichuan keeps the mountains, Guangzhou keeps the sea, Mukden keeps the dynasty's name. Heaven does not divide its mandate — it withdraws it, and waits to see who picks it up."
 je_tgc_mandate_of_heaven_complete_tt: "We hold #b Beijing, Nanjing, Sichuan, Guangdong#! and #b Southern Manchuria#!"

 tgc_shattered_mandate: "The Mandate Shattered"
 tgc_mandate_restored: "The Mandate Restored"

 je_tgc_gurkani_unify_india: "The Unity of India"
 je_tgc_gurkani_unify_india_reason: "No foreign company holds a single fort on this subcontinent, and that is precisely the problem: there is no common enemy to unite against. Delhi rules the northwest, and everywhere else a maharaja, a nizam or a confederation rules a piece. India can be unified by the army, by federal treaty, or by convincing three hundred princes they are one people. All three have been tried elsewhere. Only the last has lasted."
 je_tgc_gurkani_unify_india_complete_tt: "We hold #b Delhi, East Bengal, Hyderabad, Mysore#! and #b Bombay#!"

 je_tgc_britain_secret_of_the_east: "The Secret of the East"
 je_tgc_britain_secret_of_the_east_reason: "We have no Bengal to strip and no Company to do the stripping. What we have is coal, an island, and a hundred years of watching Konstantiniyye and Isfahan build things we could not. Our delegations return from Tabriz with drawings and from Cordoba with translations. Copying is not shameful — being copied is the goal."
 je_tgc_britain_secret_of_the_east_complete_tt: "Literacy above #b 80%#!, and #b open hearth process#! and #b reinforced concrete#! researched"

