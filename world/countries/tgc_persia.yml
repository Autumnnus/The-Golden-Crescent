# senaryo.md 100: "Basra, Kurdistan ve Baku bagimsizliklarini kazanir."
# Basra ve Kurdistan Iran'dan koptuktan sonra Rum'un yorungesine girdi -
# tanimlari world/countries/tgc_rum.yml icinde, Rum'un tampon vassallari
# olarak. Baku ise Tebriz Hanligi'yla birlesti (yukarida AZB).
# Iran'in baslangic hedeflerinden biri ucunu de geri almak.

# --- Konfederasyonun Turkistan kanadi ---------------------------------------
# Hive ve Buhara Isfahan'a federe. Bu dini degil SIYASI bir birlik: ikisi de
# Muctehidiyye, yani Ictihatci Duzen'in Sunni kolundalar, ama konfederasyonun
# ortak savunma ve ticaret kurumlarina bagli (senaryo.md 252). Konfederasyon
# federal devlete donusurse bu catlak buyuyecek.

