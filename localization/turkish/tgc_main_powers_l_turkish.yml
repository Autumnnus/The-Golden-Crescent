 je_tgc_mandate_of_heaven: "Göğün Yetkisi"
 je_tgc_mandate_of_heaven_reason: "Çing hanedanı iflasla, saray savaşlarıyla ve Uygur isyanlarıyla düştü; yerine geçen şey, her biri iddianın bir parçasını tutan beş devlet oldu. Pekin ayini, Nankin parayı, Siçuan dağları, Guangzhou denizi, Mukden hanedanın adını tutuyor. Gök yetkisini bölmez — geri çeker ve kimin yerden kaldıracağını bekler."
 je_tgc_mandate_of_heaven_complete_tt: "#b Pekin, Nankin, Siçuan, Guangdong#! ve #b Güney Mançurya#! bizde"

 tgc_shattered_mandate: "Yetki Parçalandı"
 tgc_mandate_restored: "Yetki Yeniden Kuruldu"

 je_tgc_gurkani_unify_india: "Hindistan'ın Birliği"
 je_tgc_gurkani_unify_india_reason: "Bu yarımadada tek bir yabancı şirketin tek bir kalesi yok — ve asıl sorun tam olarak bu: karşısında birleşilecek ortak bir düşman yok. Delhi kuzeybatıyı yönetiyor, geri kalan her yerde bir mihrace, bir nizam ya da bir konfederasyon bir parçayı tutuyor. Hindistan orduyla, federal antlaşmayla ya da üç yüz prensi tek bir halk olduklarına ikna ederek birleştirilebilir. Üçü de başka yerlerde denendi. Yalnızca sonuncusu kalıcı oldu."
 je_tgc_gurkani_unify_india_complete_tt: "#b Delhi, Doğu Bengal, Haydarabad, Mysore#! ve #b Bombay#! bizde"

 je_tgc_britain_secret_of_the_east: "Doğu'nun Sırrı"
 je_tgc_britain_secret_of_the_east_reason: "Soyacak bir Bengal'imiz, soyacak bir Şirketimiz yok. Elimizde kömür var, bir ada var ve Konstantiniyye ile İsfahan'ın yapamadığımız şeyleri yapışını yüz yıl seyretmişliğimiz var. Heyetlerimiz Tebriz'den çizimlerle, Kurtuba'dan tercümelerle dönüyor. Taklit etmek ayıp değil — taklit edilmek hedef."
 je_tgc_britain_secret_of_the_east_complete_tt: "Okuryazarlık #b %80#! üstünde, #b Siemens-Martin fırını#! ve #b betonarme#! araştırılmış"

