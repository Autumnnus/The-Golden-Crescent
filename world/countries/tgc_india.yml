# Gurkani Devleti ve Hindistan.
#
# senaryo.md 374: "Gurkaniler, Hindistan'in batisi ve kuzeybatisinda guclu bir
# Turk-Fars-Hint imparatorlugudur."  senaryo.md 723: ana oynanabilir devlet.
# senaryo.md 122: Muctehidiyye "Anadolu, Balkanlar, Orta Asya ve GURKANI
# devletlerinde yaygindir" - yani Gurkani Ictihatci Duzen'in parcasi.
#
# NOT: Bu evrende Britanya Hindistan'a hic girmedi (senaryo.md 615: Britanya
# yalnizca Kuzey Amerika dogu kiyisi ve bazi Atlantik adalari). Dogu Hindistan
# Sirketi'nin 21 vanilla eyaleti world/states/10_india.yml icinde yerli
# devletlere dagitilmis durumda; BIC artik hicbir yere sahip degil.

MUG:
  color: [92, 124, 190]
  country_type: recognized
  tier: empire
  cultures: [hindustani, panjabi]
  religion: mujtahidiyya
  tech_tier: 2
  literacy: middling
  capital: STATE_DELHI
  name: Gurkani Empire
  adjective: Gurkani
  name_tr: "Gurkanî Devleti"
  religion_map:
    sunni: mujtahidiyya

# --- Gurkani'nin baslica rakipleri (senaryo.md 386) -------------------------

# senaryo.md 386 ilk sirada "Maratha Konfederasyonu"nu sayiyor. Vanilla'da
# Maratha devletleri Kolhapur/Satara/Nagpur diye dagilmis durumda; senaryonun
# istedigi tek konfederasyon icin bos MAR tag'i kullanildi. Gujarat da burada:
# tarihen Gaekwad hanedaninin, yani Maratha.
MAR:
  color: [212, 128, 96]
  country_type: recognized
  tier: kingdom
  cultures: [marathi, gujarati]
  religion: hindu
  tech_tier: 3
  literacy: low
  capital: STATE_BOMBAY
  name: Maratha Confederation
  adjective: Maratha
  name_tr: "Maratha Konfederasyonu"

