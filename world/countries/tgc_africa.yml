# Afrika. Tasarim belgesi: senaryo_afrika.md
#
# KURUCU FIKIR: Umit Burnu hic onemli olmadi. Gercek tarihte Portekiz 1488'de
# burnu donmesi, doguya giden kara yollarini Muslumanlarin tutmasina karsi bir
# cabaydi. Bu evrende o caba hic gerekmedi - kisa yollar acik ve calisiyor
# (Kizildeniz-Misir, Korfez-Iran, Kansu-Uygur). Sonuc: Avrupa Afrika'ya hic
# yerlesmedi, Afrika'nin ici Afrikalilarda kaldi, ve Avrupa dogu ticaretine
# ulasamadigi icin geri kaldi (senaryo.md 15).
#
# DIN: Avrupali misyoner gelmedi. Vanilla'da Kongo'da Katolik, Guney
# Afrika'da Kalvinist nufus var - ikisi de Portekiz ve Hollanda'nin eseri,
# ikisi de burada yok.

# ===========================================================================
# ENDULUS GINESI - kole fabrikalari
# senaryo.md 544 / 317 / 325. Endulus'un somurge ekonomisinin kaynagi;
# "Iki Kitanin Halifeligi" krizinin ahlaki agirligi buradan geliyor.
# Kiyida ticaret kaleleri - ic bolge Asanti, Dahomey, Benin ve Oyo'nun.
# ===========================================================================

AGU:
  color: [230, 200, 120]
  country_type: colonial
  tier: principality
  cultures: [kissi, akan]
  religion: hikmatiyya
  tech_tier: 5
  literacy: baseline
  capital: STATE_IVORY_COAST
  name: Andalusian Guinea
  adjective: Guinean
  name_tr: "Endülüs Ginesi"
  overlord: ANL
  subject_type: colony
  liberty_desire: 25
  religion_split:
    animist: {animist: 0.75, hikmatiyya: 0.25}

# ===========================================================================
# UMMAN - Hint Okyanusu'nun ucuncu kutbu
# Svahili zinciri: Zanzibar'dan asagi Lindi, Mombasa, Mozambik, Delagoa
# Korfezi ve Umit Burnu. Zanzibar Sultanligi tarihen tam da bu hatti
# tutuyordu; burada ona Burun da eklendi cunku Avrupali hic gelmedi.
#
# Misir'la Somali-Kenya kiyisinda burun buruna: senaryo.md 641 Misir'a
# "Dogu Afrika kiyilari" veriyor ama Misir'in hatti Kizildeniz cemberi,
# Umman'inki guney okyanus. Ikisi ayni denizde, ayni mallarda, rakip.
#
# Ibadi mezhebi hicbir minbere bagli degil: Umman uc halifelik iddiasinin
# da disinda kendi hattini yurutuyor.
# ===========================================================================

OMA:
  color: [122, 148, 172]
  country_type: recognized
  tier: kingdom
  cultures: [swahili, bedouin]
  religion: ibadi
  tech_tier: 4
  literacy: low
  capital: STATE_OMAN
  name: Sultanate of Oman
  adjective: Omani
  name_tr: "Umman Sultanlığı"
  # Zanzibar hatti Umman'dan buyuk: baskent Maskat ama agirlik Afrika'da.
  # Cape'te Hollandali yerlesimci yok; istasyonun nufusu Khoi ve Svahili.
  culture_map:
    boer: khoisan
    griqua: khoisan

