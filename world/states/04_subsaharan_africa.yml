# 04_subsaharan_africa.txt bolgesindeki state atamalari
# Elle duzenlenir. Oyun dosyalari: python tools/tgc.py build

# Portekiz bu evrende hic kurulmadi (Iberya'da Galicya ve Endulus var).
# Somurgeleri senaryo.md 603-649'daki dagilima gore paylastirildi:
#   Bati Afrika limanlari -> Rum (637), Dogu Afrika kiyisi -> Misir (641),
#   Atlantik agi -> Fas (588).
