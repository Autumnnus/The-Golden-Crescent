version: 1
policy: Keep Nile, Horn and East African polities separate. Preserve inherited joint POP cultures and religions, minority
  faiths and fixed professions except a narrow correction of misplaced Kikuyu slave POP cultures in Ethiopian highland shares.
  Keep the same profession and headcount, relabel to Oromo or Sidama. Add Sennaar debt slavery law to match its inherited
  slave POPs. Modest regional population changes and differentiated literacy; no borders or diplomacy change. Country totals
  marked partial cover only listed shares.
