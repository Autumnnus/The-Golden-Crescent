version: 1
namespace: ve_academy_demo
title: İskenderiye'nin yeni sayfası
summary: Bir eğitim reformunu teklif, siyasi tercih, günlük hedefi ve sonuç eventleriyle anlatan örnek. Etkin senaryo değildir.
assumptions:
  - Mısır ve Aşağı Mısır eyaleti varlığını korur; hikâye ülke etiketine bağlıdır.
  - Kamu okulları kanununu oyuncu çıkarır. Flavor paketi başlangıç ekonomisini değiştirmez.
  - Başarı için iki yıl süre vardır. Tamamlama koşulu ve zaman aşımı aynı gün gerçekleşirse önceliği oyun motoru belirler.
variables:
  support: 0
modifiers:
  mobilization:
    title: {tr: Eğitim seferberliği, en: Education Campaign}
    values: {country_authority_add: -25}
  recognition:
    title: {tr: İskenderiye'nin itibarı, en: Alexandria's Renown}
    values: {country_prestige_add: 15}
nodes:
  petition:
    kind: event
    number: 1
    country: EGY
    entry: {pulse: monthly}
    trigger:
      after: '1836.2.1'
      before: '1860.1.1'
      primary_culture: misri
      owns_state: STATE_LOWER_EGYPT
    title: {tr: Bir kütüphaneden fazlası, en: More Than a Library}
    description:
      tr: İskenderiyeli öğretmenler ve matbaacılar saraya bir dilekçe sundu. Yeni bir akademi, yalnız seçkinlerin değil bütün çocukların öğrenimine öncülük etmelidir. Bu hedef için kamu okullarını desteklememizi istiyorlar.
      en: Teachers and printers from Alexandria have petitioned the court. A new academy should champion learning for every child, not only the elite. They ask us to support public schools.
    flavor:
      tr: Bir sayfayı çoğaltabiliriz. Peki onu okuyabilecek insanları?
      en: We can multiply a printed page. Can we multiply its readers?
    context: Reform Mısır yönetimine sunulur. Kültür ve eyalet koşulları, dilekçenin bu dünyada anlamlı olmasını sağlar.
    media: {alias: middleeast_engineer_blueprint}
    options:
      - id: support
        text: {tr: Okulların kapısını açalım., en: Open the school gates.}
        default: true
        ai_weight: 3
        effects:
          - set_variable: {name: support, value: 1}
          - add_modifier: {name: mobilization, days: 730}
        next: [{to: academy, delay_days: 1}]
      - id: decline
        text: {tr: Sarayın başka öncelikleri var., en: The court has other priorities.}
        ai_weight: 1
        next: [{to: declined, delay_days: 3}]
  academy:
    kind: journal
    country: EGY
    title: {tr: Her çocuk için bir sıra, en: A Seat for Every Child}
    description:
      tr: İki yıl içinde kamu okulları kanununu yürürlüğe koyun, akademi teknolojisini araştırın ve Aşağı Mısır üzerindeki hâkimiyetinizi koruyun.
      en: Within two years, enact public schools, research academia, and retain control of Lower Egypt.
    context: Günlük yalnız dilekçe desteklenirse açılır. Tamamlama, eyalet kaybı ve zaman aşımı ayrı sonuçlara bağlanır.
    trigger: {variable: {name: support, op: '=', value: 1}}
    complete:
      all:
        - has_law: law_public_schools
        - technology: academia
        - owns_state: STATE_LOWER_EGYPT
    fail: {not: {owns_state: STATE_LOWER_EGYPT}}
    timeout_days: 730
    on_complete:
      effects: [{remove_modifier: mobilization}]
      next: [{to: opening, delay_days: 5}]
    on_fail:
      effects: [{remove_modifier: mobilization}]
      next: [{to: setback, delay_days: 1}]
    on_timeout:
      effects: [{remove_modifier: mobilization}]
      next: [{to: setback, delay_days: 1}]
  opening:
    kind: event
    number: 2
    country: EGY
    title: {tr: İlk dersin sabahı, en: The Morning of the First Lesson}
    description:
      tr: Yeni eğitim düzeni ilk öğrencilerini karşılıyor. Akademinin başarısı ülkenin itibarını artırdı. Bu kurumların yaşayabilmesi, artık bütçeye ve öğretmenlere bağlı.
      en: The new school system welcomes its first pupils. The academy's success has enhanced the country's reputation. Its future now depends on teachers and funding.
    context: Tamamlanan reformun sonucu. İtibar etkisi geçicidir; nüfus ve ekonomi Atlas kaynağında yönetilmeye devam eder.
    media: {alias: middleeast_engineer_blueprint}
    options:
      - id: celebrate
        text: {tr: Bu yalnızca başlangıç., en: This is only the beginning.}
        default: true
        effects: [{add_modifier: {name: recognition, days: 1825}}]
  setback:
    kind: event
    number: 3
    country: EGY
    title: {tr: Ertelenen gelecek, en: A Future Deferred}
    description:
      tr: Akademi girişimi verilen süre ve siyasi şartlar içinde tamamlanamadı. Destekçiler başka bir fırsat beklemek zorunda.
      en: The academy initiative could not be completed within the allotted time and political circumstances. Its supporters must wait for another opportunity.
    context: Eyalet kaybı veya zaman aşımı bu ortak sona ulaşır. Sonuç eventi ülke başına yalnız bir kez çalışır.
    media: {alias: middleeast_upperclass_party}
    options:
      - id: close
        text: {tr: Dilekçeyi arşive kaldırın., en: File the petition away.}
        default: true
  declined:
    kind: event
    number: 4
    country: EGY
    title: {tr: Kapalı kapılar, en: Closed Doors}
    description:
      tr: Sarayın kararı öğretmenlere ulaştı. Matbaa çalışmayı sürdürüyor; akademi için ayrılan sayfalar şimdilik boş kalacak.
      en: The court's decision has reached the teachers. The press keeps running, but the pages reserved for the academy remain blank.
    context: Ret seçeneği günlüğü hiç başlatmaz ve eğitim seferberliği maliyeti oluşturmaz.
    media: {alias: middleeast_upperclass_party}
    options:
      - id: close
        text: {tr: Şimdilik böyle., en: So it stands.}
        default: true
