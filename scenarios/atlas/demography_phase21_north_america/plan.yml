# Countries whose POPs also lie outside this package.
partial_countries: [GBR]
# Country definition changes. `from` guards the pre-change value.
country_culture_overrides:
  ARP: {from: [siouan], to: [algonquian]}      # Arapaho are Algonquian speakers
  BLF: {from: [siouan], to: [algonquian]}      # Blackfoot are Algonquian speakers
  VCL: {from: [nahua], to: [hokan]}            # California valley peoples, not Nahua
  SEQ: {from: [cherokee, siouan], to: [caddoan, siouan, cherokee]}  # no Trail of Tears
country_laws:
  VVA: [law_legacy_slavery]   # plantation slavery legal (hukuk H10 Virginia)
  VDC: [law_legacy_slavery]   # Chesapeake civic district; not in the abolition list
# Shares whose inherited slave POPs are released into the free design composition.
release_slaves:
- STATE_DELAWARE/VPA
- STATE_FLORIDA/VBU
- STATE_TEXAS/VCD
- STATE_OKLAHOMA/SEQ
- STATE_GEORGIA/VCE
- STATE_TENNESSEE/VCE
- STATE_ALABAMA/VMC
- STATE_MISSISSIPPI/VCO
- STATE_ARKANSAS/VMR
- STATE_LOUISIANA/VMR
- STATE_KENTUCKY/VMR
- STATE_MISSOURI/VMR
# Homelands: cultures >= 10% of the planned state population, plus inherited local homelands
# whose culture remains >= 1% of it. Inherited settler/diaspora homelands stay only at >= 10%.
# Computed by prepare.py and recorded in the audit.
homeland_rule:
  new_share: 0.10
  keep_share: 0.01
  settler_keep_share: 0.10
  settler_cultures: [yankee, dixie, anglo_canadian, franco_canadian, cajun, afro_american, afro_antillean,
                     mexican, metis]
