# ===========================================================================
# ITALYA - guneyde Musluman emirlikler
# senaryo.md 460: "Guney: Sicilya-Sardinya Emirligi, Napoli Kralligi, Rum
# Imparatorlugu'na bagli kucuk limanlar, Malta'daki Rum askeri bolgesi."
# Sardinya Rum'a gecti; Sicilya'da emirlik kaldi, Messina Bogazi Rum'da.
# ===========================================================================

SIC:
  color: [64, 148, 130]
  country_type: recognized
  tier: kingdom
  cultures: [maltese, south_italian]
  religion: mujtahidiyya
  tech_tier: 3
  literacy: middling
  capital: STATE_SICILY
  name: Emirate of Sicily
  adjective: Sicilian
  name_tr: "Sicilya Emirliği"
  # Ada Musluman yonetimde ama nufusun buyuk kismi hala Hristiyan -
  # Endulus'un aynasi: cogulcu bir Akdeniz emirligi.
  religion_split:
    catholic: {mujtahidiyya: 0.45, catholic: 0.55}

# Musluman yukselisi Katolik Kilise'yi bolmedi, kenetledi. Papalik bu evrende
# kusatma altindaki bir Kilise'nin baskenti ve gercek bir guc; Emilia'daki uc
# kucuk duklu (Parma, Modena, Lucca) onda toplandi.
PAP:
  color: [232, 226, 214]
  country_type: recognized
  tier: kingdom
  cultures: [north_italian, south_italian]
  religion: catholic
  tech_tier: 4
  literacy: middling
  capital: STATE_LAZIO
  name: Papal States
  adjective: Papal
  name_tr: "Papalık Devleti"

NAP:
  color: [172, 196, 108]
  country_type: recognized
  tier: kingdom
  cultures: [south_italian]
  religion: catholic
  tech_tier: 4
  literacy: low
  capital: STATE_CAMPANIA
  name: Kingdom of Naples
  adjective: Neapolitan
  name_tr: "Napoli Krallığı"

