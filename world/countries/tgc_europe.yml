# dolayisiyla Kuzey Amerika'ya Puritan gocu de yok.
GBR:
  color: [186, 68, 68]
  country_type: recognized
  tier: empire
  cultures: [british, scottish]
  religion: catholic
  tech_tier: 1
  literacy: high
  capital: STATE_HOME_COUNTIES
  name: Great Britain
  adjective: British
  name_tr: "Britanya"
  religion_split:
    protestant: {catholic: 1.0}

