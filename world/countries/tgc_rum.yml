# Trabzon tek basina ince bir kiyi seridiydi; Erzurum'a katildi ve ortaya
# Karadeniz'den Kafkasya'ya uzanan tek bir dogu atabeyligi cikti.
# tributary = en gevsek bag; yuksek liberty_desire = kopma egilimi.

