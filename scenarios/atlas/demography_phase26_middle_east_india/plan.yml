country_religion_overrides: {}
country_laws:
  ADA: [law_debt_slavery]
  ERZ: [law_debt_slavery]
  TRB: [law_debt_slavery]
  KUR: [law_debt_slavery]
  SYR: [law_debt_slavery]
  LEB: [law_debt_slavery]
  PAL: [law_debt_slavery]
  KUW: [law_debt_slavery]
  TAM: [law_debt_slavery]   # H8 default; the demography 09 plan already holds 244,323 slave POPs
release_slaves:
- STATE_BASRA/BSR
replace_planned:
- STATE_MADRAS/TAM
# target share: absorbed pre-correction share whose frozen POPs are added to the existing plan
absorb:
  STATE_MADRAS/TAM: STATE_MADRAS/DEN
homeland_rule:
  new_share: 0.10
  keep_share: 0.0
  settler_keep_share: 0.10
  settler_cultures: [danish, french, british]
