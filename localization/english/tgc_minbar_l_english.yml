 # --- Events ---------------------------------------------------------------
 tgc_minbar.1.t: "An Invitation from al-Azhar"
 tgc_minbar.1.d: "The scholars of al-Azhar report that the ulema of [SCOPE.sCountry('tgc_minbar_target').GetName] have not yet ruled on the question of ijtihad. A delegation, generously provisioned, might settle the matter in Cairo's favour before the reformers arrive."
 tgc_minbar.1.f: "A minbar without listeners is only furniture."
 tgc_minbar.1.a: "Send the delegation — and pay for its hospitality."
 tgc_minbar.1.b: "The treasury has closer obligations."

 tgc_minbar.2.t: "Letters from Cordoba"
 tgc_minbar.2.d: "Students from [SCOPE.sCountry('tgc_minbar_target').GetName] have written to the academies of Cordoba asking after our jurisprudence. Endowed chairs and travel stipends would turn correspondence into a school — and a school, in time, into a settlement."
 tgc_minbar.2.f: "We convert no one. We merely answer letters, at some expense."
 tgc_minbar.2.a: "Endow the chairs and fund the stipends."
 tgc_minbar.2.b: "Let them come on their own coin."

 tgc_minbar.3.t: "A Court Without a Caliph"
 tgc_minbar.3.d: "The jurists of [SCOPE.sCountry('tgc_minbar_target').GetName] have asked how a state may legislate without waiting on a caliph's seal. Our answer is a whole school of law — and schools are built, not sent."
 tgc_minbar.3.f: "Religious authority is not exported. It is founded, locally, and then it belongs to them."
 tgc_minbar.3.a: "Found the school and staff it from our own faculties."
 tgc_minbar.3.b: "Let them arrive at it themselves, or not at all."
