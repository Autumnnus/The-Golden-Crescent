policy: >-
  Three crowns have separate state populations; the shared monarch is not
  another population pool. Catholic court religion does not make every
  English or Welsh person Catholic, and Protestant Scottish institutions do
  not erase Highland Catholic and Gaelic communities. Ireland's reduced
  country target preserves all inherited fixed-profession headcounts and
  distinct Ulster settlement groups. No overseas GBR or New England POP is
  included in these crown targets.
