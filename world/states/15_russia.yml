# 15_russia.txt bolgesindeki state atamalari
# Elle duzenlenir. Oyun dosyalari: python tools/tgc.py build
#
# senaryo.md 477: "Rusya birlesememistir. Kirim Hanligi ve Buyuk Tatar Hanligi
# varliklarini korumaktadir. Ruslarin Sibirya'ya ilerleyisi buyuk olcude
# durdurulmustur."
#
#   RUS  Moskova Buyuk Prensligi - kucuk bir ic Rusya devleti, uc vassali var
#   NOV  Novgorod  - Moskova'nin vassali (kuzey ticaret cumhuriyeti)
#   MRD  Mordva    - Moskova'nin vassali (Volga halklari)
#   MRI  Mari      - Moskova'nin vassali (Volga halklari)
#   TAR  Buyuk Tatar Hanligi - Kazan'dan Aral'a; Kazak Hanligi buna katildi
#   CRI  Kirim Hanligi - Karadeniz bozkiri
#   KHI/BUK - Hive ve Buhara, Iran konfederasyonuna federe (world/countries)

# --- Moskova Buyuk Prensligi'nin cekirdegi ---------------------------------
