# Installed Turkish hub labels and province owners are verified by verify.py.
# Profiled names come from local languages (Nahuatl, Purepecha, Maya, Taino...), from the
# Andalusian Arabic toponymy (Guadalajara), or from the colonial power that actually holds the
# place in this world (French Antilles, Nassau, Willemstad, Christiansted). Castilian saint and
# English names in Andalusian or local territory (Veracruz, San Juan, Kingston...) are skipped.
