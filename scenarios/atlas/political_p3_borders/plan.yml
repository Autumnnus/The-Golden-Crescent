# P3 — border revision after the fifth game review (user decisions 25 Sep 2026).
# Italy/Germany less vanilla, Poland's victory over Rum and Austria, one Kazakh khanate under the
# Tatars, a large Uyghur khanate, Muslim Andalusian America, fewer North African/Saharan polities and
# Moroccan/Andalusian West African colonies. See README.md for the narrative and the decisions.
version: 1
# Province moves create a new part inside a state. `total` people leave the old owner's share with
# its literacy; `composition` is the new part's population mix (default: the old share's mix);
# `industry` adds explicit buildings to the new part, `take` moves levels from the old part to it.
moves:
  # Rum's western Mediterranean naval stations (user choice: Ceuta and southern Sardinia)
  - state: STATE_SICILY            # Val di Mazara: Trapani, Marsala, Mazara, Sciacca
    from: SIC
    to: RUM
    provinces: [x8A0548, xC090A0]
    total: 330000
    composition:
      - {culture: south_italian, religion: catholic, share: 0.61}
      - {culture: south_italian, religion: sunni, share: 0.18}   # Sicilian Muslims of the old emirate
      - {culture: turkish, religion: sunni, share: 0.14}
      - {culture: maghrebi, religion: sunni, share: 0.06}
      - {culture: sephardic, religion: jewish, share: 0.01}
    industry: {building_port: 1, building_naval_administration: 3}
  - state: STATE_SARDINIA          # Cagliari, Sulcis and the southern coast
    from: SAR
    to: RUM
    provinces: [x0D6170, xFD923D, x80D020]
    total: 210000
    composition:
      - {culture: south_italian, religion: catholic, share: 0.72}
      - {culture: south_italian, religion: sunni, share: 0.10}
      - {culture: turkish, religion: sunni, share: 0.12}
      - {culture: maghrebi, religion: sunni, share: 0.05}
      - {culture: sephardic, religion: jewish, share: 0.01}
    industry: {building_port: 1, building_naval_administration: 2}
  - state: STATE_AL_RIF            # Ceuta (Septe) at the Strait, on the route to New Bursa
    from: MOR
    to: RUM
    provinces: [xA0B0C0]
    total: 26000
    composition:
      - {culture: maghrebi, religion: sunni, share: 0.48}
      - {culture: turkish, religion: sunni, share: 0.32}
      - {culture: berber, religion: sunni, share: 0.12}
      - {culture: sephardic, religion: jewish, share: 0.05}
      - {culture: spanish, religion: catholic, share: 0.03}
    industry: {building_naval_administration: 2}
  # Republic of Genoa: the Ligurian coast
  - state: STATE_PIEDMONT
    from: SAR
    to: VCN
    provinces: [x904061, x5F6BAA, x54728A]
    total: 600000
    composition:
      - {culture: north_italian, religion: catholic, share: 0.985}
      - {culture: sephardic, religion: jewish, share: 0.01}
      - {culture: greek, religion: orthodox, share: 0.005}
    industry: {building_port: 1}
    # Piedmont's coastal buildings sit on the Ligurian coast and leave the now landlocked Savoyard part
    take: {building_port: 1, building_shipyard: 2, building_fishing_wharf: 2, building_naval_administration: 5}
# Whole owner shares change hands, in order. When the receiver already has a part in the state the
# two parts merge (provinces, people, literacy weighted, composition and buildings summed).
